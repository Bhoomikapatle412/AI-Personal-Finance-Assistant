
{% extends "base.html" %}

{% block content %}
<div class="container mt-4">
    <h2>Budget Management</h2>
    <p class="text-muted">Set monthly spending limits for your categories.</p>

    <div class="card p-4 mb-4">
        <h4>Set Monthly Budget</h4>

        <form id="budgetForm">
            <div class="mb-3">
                <label for="category_id" class="form-label">Category</label>
                <select id="category_id" class="form-select" required>
                    <option value="">Select Category</option>
                </select>
            </div>

            <div class="mb-3">
                <label for="amount" class="form-label">Budget Amount (₹)</label>
                <input
                    type="number"
                    id="amount"
                    class="form-control"
                    min="1"
                    step="0.01"
                    placeholder="Enter budget amount"
                    required
                >
            </div>

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="month" class="form-label">Month</label>
                    <select id="month" class="form-select" required></select>
                </div>

                <div class="col-md-6 mb-3">
                    <label for="year" class="form-label">Year</label>
                    <select id="year" class="form-select" required></select>
                </div>
            </div>

            <button type="submit" class="btn btn-primary">Save Budget</button>
        </form>

        <div id="message" class="mt-3"></div>
    </div>

    <div class="card p-4">
        <h4>Your Budgets</h4>
        <div id="budgetList">
            <p class="text-muted">Loading budgets...</p>
        </div>
    </div>
</div>

<script>
document.addEventListener("DOMContentLoaded", async function () {
    const categorySelect = document.getElementById("category_id");
    const monthSelect = document.getElementById("month");
    const yearSelect = document.getElementById("year");
    const budgetList = document.getElementById("budgetList");
    const message = document.getElementById("message");

    const now = new Date();
    const currentMonth = now.getMonth() + 1;
    const currentYear = now.getFullYear();

    const months = [
        "January", "February", "March", "April",
        "May", "June", "July", "August",
        "September", "October", "November", "December"
    ];

    months.forEach((month, index) => {
        const option = document.createElement("option");
        option.value = index + 1;
        option.textContent = month;
        monthSelect.appendChild(option);
    });

    monthSelect.value = currentMonth;

    for (let year = currentYear - 1; year <= currentYear + 2; year++) {
        const option = document.createElement("option");
        option.value = year;
        option.textContent = year;
        yearSelect.appendChild(option);
    }

    yearSelect.value = currentYear;

    async function loadCategories() {
        const response = await fetch("/transactions/categories");

        if (!response.ok) {
            throw new Error("Failed to load categories");
        }

        const categories = await response.json();

        categories.forEach(category => {
            const option = document.createElement("option");
            option.value = category.id;
            option.textContent = category.name;
            categorySelect.appendChild(option);
        });
    }

    async function loadBudgets() {
        const month = monthSelect.value;
        const year = yearSelect.value;

        const response = await fetch(
            `/budgets/?month=${month}&year=${year}`
        );

        if (!response.ok) {
            throw new Error("Failed to load budgets");
        }

        const budgets = await response.json();

        if (budgets.length === 0) {
            budgetList.innerHTML =
                '<p class="text-muted">No budgets set for this month.</p>';
            return;
        }

        budgetList.innerHTML = budgets.map(budget => `
            <div class="border rounded p-3 mb-2">
                <div class="d-flex justify-content-between">
                    <strong>${budget.category}</strong>
                    <span>₹${budget.amount.toLocaleString("en-IN")}</span>
                </div>
            </div>
        `).join("");
    }

    document.getElementById("budgetForm").addEventListener("submit", async function (e) {
        e.preventDefault();

        const payload = {
            category_id: categorySelect.value,
            amount: document.getElementById("amount").value,
            month: monthSelect.value,
            year: yearSelect.value
        };

        const response = await fetch("/budgets/", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(payload)
        });

        const result = await response.json();

        message.innerHTML = response.ok
            ? '<div class="alert alert-success">' + result.message + '</div>'
            : '<div class="alert alert-danger">' + result.error + '</div>';

        if (response.ok) {
            document.getElementById("amount").value = "";
            await loadBudgets();
        }
    });

    monthSelect.addEventListener("change", loadBudgets);
    yearSelect.addEventListener("change", loadBudgets);

    try {
        await loadCategories();
        await loadBudgets();
    } catch (error) {
        budgetList.innerHTML =
            '<div class="alert alert-danger">Unable to load budget data.</div>';
        console.error(error);
    }
});
</script>
{% endblock %}
