{% extends "base.html" %}

{% block content %}

<div class="auth-container">

    <h1>Create Account</h1>

    <form method="POST">

        <div>
            <label for="full_name">Full Name</label>
            <input
                type="text"
                id="full_name"
                name="full_name"
                required
            >
        </div>

        <div>
            <label for="email">Email</label>
            <input
                type="email"
                id="email"
                name="email"
                required
            >
        </div>

        <div>
            <label for="password">Password</label>
            <input
                type="password"
                id="password"
                name="password"
                required
            >
        </div>

        <button type="submit">
            Create Account
        </button>

    </form>

    <p>
        Already have an account?
        <a href="{{ url_for('auth.login') }}">Login</a>
    </p>

</div>

{% endblock %}
