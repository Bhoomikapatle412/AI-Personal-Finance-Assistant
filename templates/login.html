{% extends "base.html" %}

{% block content %}

<div class="auth-container">

    <h1>Login</h1>

    <form method="POST">

        <div>
            <label for="email">Email</label>

            <input
                type="email"
                id="email"
                name="email"
                required
            >
        </div>

        <div>
            <label for="password">Password</label>

            <input
                type="password"
                id="password"
                name="password"
                required
            >
        </div>

        <button type="submit">
            Login
        </button>

    </form>

    <p>
        Don't have an account?
        <a href="{{ url_for('auth.register') }}">
            Create an account
        </a>
    </p>

</div>

{% endblock %}
