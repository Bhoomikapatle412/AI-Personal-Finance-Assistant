{% extends "base.html" %}

{% block content %}

<div class="transaction-container">

    <h1>Add Transaction with AI</h1>

    <p>
        Describe your transaction naturally.
    </p>

    <p>
        Examples:
        <br>
        <strong>dosa 60</strong>
        <br>
        <strong>swiggy biryani 250</strong>
        <br>
        <strong>myntra shopping 421</strong>
        <br>
        <strong>recharge 30</strong>
    </p>

    <form method="POST">

        <div>
            <label for="transaction_text">
                What did you spend money on?
            </label>

            <textarea
                id="transaction_text"
                name="transaction_text"
                rows="4"
                placeholder="e.g. dosa 60"
                required
            ></textarea>
        </div>

        <div>

            <label for="payment_method">
                Payment Method
            </label>

            <select
                id="payment_method"
                name="payment_method"
                required
            >

                <option value="">
                    Select payment method
                </option>

                {% for method in payment_methods %}

                    <option value="{{ method.value }}">
                        {{ method.value }}
                    </option>

                {% endfor %}

            </select>

        </div>

        <div>

            <label for="transaction_date">
                Date
            </label>

            <input
                type="date"
                id="transaction_date"
                name="transaction_date"
            >

        </div>

        <button type="submit">
            Understand with AI
        </button>

    </form>

    <p>
        <a href="{{ url_for('dashboard.dashboard') }}">
            Back to Dashboard
        </a>
    </p>

</div>

{% endblock %}
