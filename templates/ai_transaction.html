{% extends "base.html" %}

{% block content %}

<div class="container">

    <h1>Add Transaction with AI</h1>

    <p>
        Describe your transaction naturally and let AI organize it for you.
    </p>

    <p><strong>Examples:</strong></p>

    <ul>
        <li>dosa 60</li>
        <li>swiggy biryani 250</li>
        <li>myntra shopping 421</li>
        <li>recharge 30</li>
        <li>pizza 240</li>
        <li>salary 50000</li>
    </ul>

    <form
        method="POST"
        action="{{ url_for('transaction.ai_add_transaction') }}"
    >

        <div>

            <label for="transaction_text">
                What was the transaction?
            </label>

            <br>

            <textarea
                id="transaction_text"
                name="transaction_text"
                rows="5"
                cols="50"
                placeholder="Example: pizza 240"
                required
            ></textarea>

        </div>

        <br>

        <div>

            <label for="payment_method">
                Payment Method
            </label>

            <br>

            <select
                id="payment_method"
                name="payment_method"
                required
            >

                {% for method in payment_methods %}

                    <option
                        value="{{ method.value }}"
                        {% if method == payment_methods.OTHER %}
                            selected
                        {% endif %}
                    >
                        {{ method.value }}
                    </option>

                {% endfor %}

            </select>

        </div>

        <br>

        <div>

            <label for="transaction_date">
                Date
            </label>

            <br>

            <input
                type="date"
                id="transaction_date"
                name="transaction_date"
            >

        </div>

        <br>

        <button type="submit">
            Understand Transaction
        </button>

    </form>

    <br>

    <a href="{{ url_for('dashboard.dashboard') }}">
        Back to Dashboard
    </a>

</div>

{% endblock %}
